# Configuracion de build para Railway (Nixpacks).
# - aptPkgs: instala ffmpeg en el contenedor (necesario para make_video.py).
# - start.cmd: lanza Streamlit en el puerto que Railway asigna por $PORT.
# Las dependencias de Python las detecta Nixpacks por requirements.txt.

[phases.setup]
aptPkgs = ["ffmpeg"]

[start]
cmd = "streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false"
